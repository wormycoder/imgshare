<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Gallery</title>

    <!-- Firebase SDKs (Firestore only — no Storage needed) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        #user-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent);
        }

        input, select, textarea {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        header {
            padding: 1rem 2rem;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        .upload-section {
            background: #1e293b;
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .upload-status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .post-card:hover { transform: translateY(-5px); }

        .post-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .post-info {
            padding: 15px;
        }

        .post-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .comment-section {
            border-top: 1px solid #334155;
            padding: 10px;
            font-size: 0.9rem;
        }

        .comment {
            background: #0f172a;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .tag-adult {
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 3px;
            float: right;
        }

        .post-card { cursor: pointer; }

        /* --- Age/Consent Gate --- */
        #consent-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #consent-overlay.open {
            display: flex;
        }

        .consent-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--danger);
            max-width: 420px;
        }

        .consent-card h2 {
            color: var(--danger);
            margin-top: 0;
        }

        .consent-check-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            text-align: left;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .consent-check-row input[type="checkbox"] {
            width: auto;
            margin: 3px 0 0 0;
        }

        .consent-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .consent-buttons button.cancel-btn {
            background: #475569;
            color: white;
        }

        #consent-enter-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- Fullscreen Viewer --- */
        #viewer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
        }

        #viewer-overlay.open {
            display: flex;
        }

        .viewer-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            background: none;
            color: white;
            border: none;
            cursor: pointer;
            z-index: 2001;
            padding: 0 10px;
        }

        .viewer-image-pane {
            flex: 1 1 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            min-width: 0;
        }

        .viewer-image-pane img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        .viewer-side-pane {
            flex: 0 0 400px;
            max-width: 400px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            border-left: 2px solid #334155;
        }

        .viewer-header {
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
        }

        .viewer-header .post-meta { margin: 0; }

        .viewer-comments {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .comment-block {
            margin-bottom: 16px;
        }

        .comment-body {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .comment-body .comment-user {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .comment-body .comment-text {
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .comment-actions {
            display: flex;
            gap: 15px;
            margin-top: 4px;
            margin-left: 4px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .comment-actions span {
            cursor: pointer;
            user-select: none;
        }

        .comment-actions span:hover {
            color: var(--accent);
        }

        .comment-actions span.liked {
            color: var(--accent);
            font-weight: bold;
        }

        .replies-block {
            margin-left: 20px;
            margin-top: 8px;
            border-left: 2px solid #334155;
            padding-left: 12px;
        }

        .reply-input-row {
            display: none;
            gap: 5px;
            margin-top: 6px;
            margin-left: 4px;
        }

        .reply-input-row.open {
            display: flex;
        }

        .reply-input-row input {
            margin-bottom: 0;
            font-size: 0.8rem;
            padding: 6px;
        }

        .reply-input-row button {
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .viewer-add-comment {
            border-top: 1px solid #334155;
            padding: 15px 20px;
            display: flex;
            gap: 8px;
        }

        .viewer-add-comment input {
            margin-bottom: 0;
        }

        @media (max-width: 800px) {
            #viewer-overlay.open {
                flex-direction: column;
            }
            .viewer-image-pane {
                flex: 0 0 45%;
            }
            .viewer-side-pane {
                flex: 1;
                max-width: 100%;
                border-left: none;
                border-top: 2px solid #334155;
            }
        }
    </style>
</head>
<body>

    <!-- Age / Consent Gate -->
    <div id="consent-overlay">
        <div class="consent-card">
            <h2>⚠️ Adult Content Warning</h2>
            <p>This section may contain content intended for adults only. You must confirm the following to continue:</p>
            <div class="consent-check-row">
                <input type="checkbox" id="consent-age">
                <label for="consent-age">I confirm that I am at least 18 years old.</label>
            </div>
            <div class="consent-check-row">
                <input type="checkbox" id="consent-agree">
                <label for="consent-agree">I consent to viewing adult content and understand it may not be suitable for all audiences.</label>
            </div>
            <div class="consent-buttons">
                <button class="cancel-btn" onclick="cancelConsent()">Cancel</button>
                <button id="consent-enter-btn" onclick="confirmConsent()" disabled>Enter</button>
            </div>
        </div>
    </div>

    <div id="user-overlay">
        <div class="auth-card">
            <h2>Welcome to the Gallery</h2>
            <input type="text" id="username-input" placeholder="Enter your username...">
            <button onclick="saveUser()">Enter Gallery</button>
        </div>
    </div>

    <header>
        <h1>🖼️ Public Gallery</h1>
        <div id="display-user"></div>
    </header>

    <!-- Upload Form -->
    <div class="upload-section">
        <div>
            <label>Select Image</label>
            <input type="file" id="file-input" accept="image/*">
        </div>
        <div>
            <label>Category</label>
            <select id="category-input">
                <option value="general">General</option>
                <option value="adult">Adults Section (18+)</option>
            </select>
        </div>
        <div>
            <button id="upload-btn" onclick="uploadImage()">Post Photo</button>
            <div class="upload-status" id="upload-status"></div>
        </div>
    </div>

    <div class="filter-bar">
        <button onclick="filterGallery('all')">Show All</button>
        <button onclick="filterGallery('general')">General Only</button>
        <button onclick="filterGallery('adult')" style="background: var(--danger)">Adults Section</button>
    </div>

    <div class="gallery" id="gallery-grid">
        <!-- Images will load here -->
    </div>

    <!-- Fullscreen Viewer -->
    <div id="viewer-overlay">
        <button class="viewer-close" onclick="closeViewer()">&times;</button>
        <div class="viewer-image-pane">
            <img id="viewer-image" src="">
        </div>
        <div class="viewer-side-pane">
            <div class="viewer-header">
                <div class="post-meta" id="viewer-meta"></div>
            </div>
            <div class="viewer-comments" id="viewer-comments">
                <!-- comments load here -->
            </div>
            <div class="viewer-add-comment">
                <input type="text" id="viewer-comment-input" placeholder="Add a comment...">
                <button onclick="submitViewerComment()">Post</button>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDhu6227E7v5XbmZLPAWYBS4_4oIekNkm0",
            authDomain: "aquaos-a9f21.firebaseapp.com",
            databaseURL: "https://aquaos-a9f21-default-rtdb.firebaseio.com",
            projectId: "aquaos-a9f21",
            storageBucket: "aquaos-a9f21.firebasestorage.app",
            messagingSenderId: "835752905131",
            appId: "1:835752905131:web:58e9c81e11f084ef08aaee"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('gallery_user') || "";

        // Adult content consent — remembered per browser via localStorage,
        // but requires an explicit click of "Enter" each time it's not yet set.
        let adultConsentGiven = localStorage.getItem('gallery_adult_consent') === 'true';
        let pendingConsentAction = null; // function to run once consent is confirmed

        document.addEventListener('DOMContentLoaded', () => {
            const ageBox = document.getElementById('consent-age');
            const agreeBox = document.getElementById('consent-agree');
            const enterBtn = document.getElementById('consent-enter-btn');
            const updateEnterState = () => {
                enterBtn.disabled = !(ageBox.checked && agreeBox.checked);
            };
            ageBox.addEventListener('change', updateEnterState);
            agreeBox.addEventListener('change', updateEnterState);
        });

        function requireAdultConsent(action) {
            if (adultConsentGiven) {
                action();
                return;
            }
            pendingConsentAction = action;
            document.getElementById('consent-age').checked = false;
            document.getElementById('consent-agree').checked = false;
            document.getElementById('consent-enter-btn').disabled = true;
            document.getElementById('consent-overlay').classList.add('open');
        }

        function confirmConsent() {
            adultConsentGiven = true;
            localStorage.setItem('gallery_adult_consent', 'true');
            document.getElementById('consent-overlay').classList.remove('open');
            const action = pendingConsentAction;
            pendingConsentAction = null;
            if (action) action();
        }

        function cancelConsent() {
            pendingConsentAction = null;
            document.getElementById('consent-overlay').classList.remove('open');
        }

        function saveUser() {
            const input = document.getElementById('username-input');
            if (input.value.trim()) {
                localStorage.setItem('gallery_user', input.value);
                currentUser = input.value;
                document.getElementById('user-overlay').style.display = 'none';
                document.getElementById('display-user').innerText = `Hello, ${currentUser}`;
            }
        }

        window.onload = () => {
            if(currentUser) {
                document.getElementById('user-overlay').style.display = 'none';
                document.getElementById('display-user').innerText = `Hello, ${currentUser}`;
            }
            loadPosts();
        };

        // --- IMAGE COMPRESSION (client-side, so we can store as base64 in Firestore) ---
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject(new Error("Could not load image for compression"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Could not read file"));
                reader.readAsDataURL(file);
            });
        }

        // --- IMAGE UPLOAD LOGIC (Firestore-only, no Firebase Storage) ---
        async function uploadImage() {
            const fileInput = document.getElementById('file-input');
            const category = document.getElementById('category-input').value;
            const btn = document.getElementById('upload-btn');
            const status = document.getElementById('upload-status');

            if (!fileInput.files[0]) return alert("Please select a file");

            const file = fileInput.files[0];
            btn.disabled = true;

            try {
                status.innerText = "Compressing image...";
                let dataUrl = await compressImage(file, 1000, 0.7);

                if (dataUrl.length > 700000) {
                    status.innerText = "Still too large, compressing further...";
                    dataUrl = await compressImage(file, 700, 0.5);
                }

                if (dataUrl.length > 900000) {
                    alert("This image is too large even after compression. Please choose a smaller or simpler image.");
                    status.innerText = "";
                    btn.disabled = false;
                    return;
                }

                status.innerText = "Uploading...";
                await db.collection("posts").add({
                    url: dataUrl,
                    user: currentUser,
                    category: category,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    comments: []
                });

                alert("Uploaded successfully!");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Upload failed: " + e.message);
                status.innerText = "";
                btn.disabled = false;
            }
        }

        // --- LOAD & DISPLAY ---
        let postsCache = {}; // postId -> data, kept in sync so the viewer can re-render fast

        async function loadPosts(filter = 'all') {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = "Loading posts...";

            const snapshot = await db.collection("posts").orderBy("timestamp", "desc").get();
            grid.innerHTML = "";
            postsCache = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                postsCache[doc.id] = data;

                if (filter !== 'all' && data.category !== filter) return;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openViewer(doc.id);
                const commentCount = countComments(data.comments || []);
                card.innerHTML = `
                    <img src="${data.url}" loading="lazy">
                    <div class="post-info">
                        ${data.category === 'adult' ? '<span class="tag-adult">18+</span>' : ''}
                        <div class="post-meta">Posted by <b>${escapeHtml(data.user)}</b> · ${commentCount} comment${commentCount === 1 ? '' : 's'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function countComments(comments) {
            return comments.reduce((sum, c) => sum + 1 + (c.replies ? c.replies.length : 0), 0);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str == null ? '' : str;
            return div.innerHTML;
        }

        function makeId() {
            return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
        }

        function filterGallery(cat) {
            if (cat === 'adult') {
                requireAdultConsent(() => loadPosts('adult'));
            } else {
                loadPosts(cat);
            }
        }

        // --- FULLSCREEN VIEWER ---
        let activePostId = null;

        function openViewer(postId) {
            const data = postsCache[postId];
            if (!data) return;

            if (data.category === 'adult') {
                requireAdultConsent(() => openViewerConfirmed(postId));
            } else {
                openViewerConfirmed(postId);
            }
        }

        function openViewerConfirmed(postId) {
            activePostId = postId;
            const data = postsCache[postId];
            if (!data) return;

            document.getElementById('viewer-image').src = data.url;
            document.getElementById('viewer-meta').innerHTML =
                `Posted by <b>${escapeHtml(data.user)}</b>` +
                (data.category === 'adult' ? ' <span class="tag-adult">18+</span>' : '');

            renderViewerComments(data.comments || []);
            document.getElementById('viewer-comment-input').value = '';
            document.getElementById('viewer-overlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').classList.remove('open');
            document.body.style.overflow = '';
            activePostId = null;
        }

        function renderViewerComments(comments) {
            const container = document.getElementById('viewer-comments');

            if (!comments.length) {
                container.innerHTML = '<div style="color:#94a3b8; font-size:0.9rem;">No comments yet. Be the first!</div>';
                return;
            }

            container.innerHTML = comments.map(c => renderCommentBlock(c)).join('');
        }

        function renderCommentBlock(c) {
            const likes = c.likes || [];
            const liked = likes.includes(currentUser);
            const replies = c.replies || [];

            return `
                <div class="comment-block">
                    <div class="comment-body">
                        <div class="comment-user">${escapeHtml(c.user)}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                    <div class="comment-actions">
                        <span class="${liked ? 'liked' : ''}" onclick="toggleLike('${c.id}')">
                            👍 ${likes.length > 0 ? likes.length : 'Like'}
                        </span>
                        <span onclick="toggleReplyBox('${c.id}')">Reply</span>
                    </div>
                    <div class="reply-input-row" id="reply-row-${c.id}">
                        <input type="text" id="reply-input-${c.id}" placeholder="Write a reply...">
                        <button onclick="submitReply('${c.id}')">Send</button>
                    </div>
                    ${replies.length ? `
                        <div class="replies-block">
                            ${replies.map(r => renderReplyBlock(c.id, r)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderReplyBlock(parentId, r) {
            const likes = r.likes || [];
            const liked = likes.includes(currentUser);
            return `
                <div class="comment-block">
                    <div class="comment-body">
                        <div class="comment-user">${escapeHtml(r.user)}</div>
                        <div class="comment-text">${escapeHtml(r.text)}</div>
                    </div>
                    <div class="comment-actions">
                        <span class="${liked ? 'liked' : ''}" onclick="toggleReplyLike('${parentId}','${r.id}')">
                            👍 ${likes.length > 0 ? likes.length : 'Like'}
                        </span>
                    </div>
                </div>
            `;
        }

        function toggleReplyBox(commentId) {
            const row = document.getElementById(`reply-row-${commentId}`);
            row.classList.toggle('open');
            if (row.classList.contains('open')) {
                document.getElementById(`reply-input-${commentId}`).focus();
            }
        }

        // --- COMMENT / LIKE / REPLY WRITES ---
        // Comments are stored as an array on the post doc. Since Firestore's
        // arrayUnion can't target a specific element to mutate, we read-modify-write
        // the whole array for likes/replies. Fine at small-to-medium comment volume.

        async function submitViewerComment() {
            if (!activePostId) return;
            const input = document.getElementById('viewer-comment-input');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                id: makeId(),
                user: currentUser || 'Anonymous',
                text: text,
                likes: [],
                replies: []
            };

            const data = postsCache[activePostId];
            const updated = [...(data.comments || []), newComment];

            await db.collection("posts").doc(activePostId).update({ comments: updated });
            data.comments = updated;
            renderViewerComments(updated);
            input.value = '';
        }

        async function submitReply(commentId) {
            if (!activePostId) return;
            const input = document.getElementById(`reply-input-${commentId}`);
            const text = input.value.trim();
            if (!text) return;

            const data = postsCache[activePostId];
            const updated = (data.comments || []).map(c => {
                if (c.id !== commentId) return c;
                const replies = c.replies ? [...c.replies] : [];
                replies.push({
                    id: makeId(),
                    user: currentUser || 'Anonymous',
                    text: text,
                    likes: []
                });
                return { ...c, replies };
            });

            await db.collection("posts").doc(activePostId).update({ comments: updated });
            data.comments = updated;
            renderViewerComments(updated);
        }

        async function toggleLike(commentId) {
            if (!activePostId) return;
            const data = postsCache[activePostId];
            const user = currentUser || 'Anonymous';

            const updated = (data.comments || []).map(c => {
                if (c.id !== commentId) return c;
                const likes = c.likes ? [...c.likes] : [];
                const idx = likes.indexOf(user);
                if (idx === -1) likes.push(user); else likes.splice(idx, 1);
                return { ...c, likes };
            });

            await db.collection("posts").doc(activePostId).update({ comments: updated });
            data.comments = updated;
            renderViewerComments(updated);
        }

        async function toggleReplyLike(commentId, replyId) {
            if (!activePostId) return;
            const data = postsCache[activePostId];
            const user = currentUser || 'Anonymous';

            const updated = (data.comments || []).map(c => {
                if (c.id !== commentId) return c;
                const replies = (c.replies || []).map(r => {
                    if (r.id !== replyId) return r;
                    const likes = r.likes ? [...r.likes] : [];
                    const idx = likes.indexOf(user);
                    if (idx === -1) likes.push(user); else likes.splice(idx, 1);
                    return { ...r, likes };
                });
                return { ...c, replies };
            });

            await db.collection("posts").doc(activePostId).update({ comments: updated });
            data.comments = updated;
            renderViewerComments(updated);
        }

        // Close viewer on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeViewer();
        });
    </script>
</body>
</html>
